<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">虚构示例材料图</title>
  <desc id="desc">仅用于页面布局测试，不对应真实交易。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ddd6c9"/>
      <stop offset="1" stop-color="#b9aa93"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-opacity=".2"/>
    </filter>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <rect x="110" y="80" width="980" height="600" rx="12" fill="#f8f5ee" filter="url(#shadow)"/>
  <circle cx="600" cy="330" r="180" fill="#252a2d"/>
  <circle cx="600" cy="330" r="72" fill="#d36a45"/>
  <circle cx="600" cy="330" r="12" fill="#f8f5ee"/>
  <path d="M455 115h290" stroke="#807767" stroke-width="4"/>
  <text x="600" y="555" text-anchor="middle" font-family="sans-serif" font-size="46" font-weight="700" fill="#252a2d">虚构示例材料</text>
  <text x="600" y="608" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#665f54">不对应任何真实账号、交易、截图或指控</text>
</svg>
